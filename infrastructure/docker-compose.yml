services:
  minio:
    # minio/minio удалён с Docker Hub; pgsty/silo - поддерживаемый форк MinIO с тем же CLI и API
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    container_name: bigdata_minio
    ports:
      - "9000:9000"       # API порт (boto3, duckdb, polars)
      - "9001:9001"       # Консоль управления в браузере
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: SuperSecretPassword123
    volumes:
      - minio_academic_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_academic_data:
